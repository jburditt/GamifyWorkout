<div class="add-exercise-dialog">
  <h2 mat-dialog-title>Add Exercise</h2>

  <mat-dialog-content>
    <form [formGroup]="form">
      <mat-form-field appearance="fill">
        <mat-label>Exercise</mat-label>
        <mat-select formControlName="exerciseId">
          <mat-option *ngFor="let exercise of exercises$ | async" [value]="exercise.id">
            {{ exercise.name }} ({{ exercise.primaryMuscleGroup }})
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('exerciseId')?.invalid && form.get('exerciseId')?.touched">
          Select an exercise.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Sets</mat-label>
        <input matInput type="number" formControlName="sets" min="1" max="100" />
        <mat-error *ngIf="form.get('sets')?.invalid && form.get('sets')?.touched">
          Sets must be between 1 and 100.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Reps</mat-label>
        <input matInput type="number" formControlName="reps" min="1" max="100" />
        <mat-error *ngIf="form.get('reps')?.invalid && form.get('reps')?.touched">
          Reps must be between 1 and 100.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Weight</mat-label>
        <input matInput type="number" formControlName="weight" min="0" step="0.1" />
        <mat-error *ngIf="form.get('weight')?.invalid && form.get('weight')?.touched">
          Weight must be zero or greater.
        </mat-error>
      </mat-form-field>

      <div class="form-error" *ngIf="saveError">{{ saveError }}</div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="onSave()" [disabled]="form.invalid">
      Save
    </button>
  </mat-dialog-actions>
</div>
